[package]
name = "compact-img"
version = "0.1.1"
description = "Compactacao local de imagens em lote."
authors = ["Douglas Kusanagi"]
edition = "2021"

[lib]
name = "compact_img_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
fast_image_resize = "6"
image = "0.25.10"
webp = { version = "0.3", default-features = false }
mozjpeg-rs = "0.9.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
urlencoding = "2"
