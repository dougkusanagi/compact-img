[package]
name = "compact-img"
version = "0.1.0"
description = "Compactacao local de imagens em lote."
authors = ["Douglas Kusanagi"]
edition = "2021"

[lib]
name = "compact_img_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
urlencoding = "2"
