<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GuepardoSys Compact — protótipo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F2B233'/%3E%3Cpath d='M22.4 9.6A9 9 0 1 0 25 16' fill='none' stroke='%23171109' stroke-width='3.6' stroke-linecap='round'/%3E%3Ccircle cx='19.9' cy='16' r='2.1' fill='%23171109'/%3E%3Ccircle cx='15.5' cy='16' r='1.45' fill='%23171109'/%3E%3Ccircle cx='12.2' cy='16' r='.9' fill='%23171109'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Instrument Sans', 'system-ui', 'sans-serif'], display: ['Bricolage Grotesque', 'Instrument Sans', 'sans-serif'], mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'] },
        fontWeight: { 450: '450', 500: '500', 550: '550', 600: '600', 650: '650', 700: '700' },
        colors: {
          bg: 'rgb(var(--bg) / <alpha-value>)',
          panel: 'rgb(var(--panel) / <alpha-value>)',
          elev: 'rgb(var(--elev) / <alpha-value>)',
          line: 'rgb(var(--line) / <alpha-value>)',
          ink: 'rgb(var(--ink) / <alpha-value>)',
          mute: 'rgb(var(--mute) / <alpha-value>)',
          dim: 'rgb(var(--dim) / <alpha-value>)',
          accent: 'rgb(var(--accent) / <alpha-value>)',
          onaccent: 'rgb(var(--on-accent) / <alpha-value>)',
          ok: 'rgb(var(--ok) / <alpha-value>)',
          warn: 'rgb(var(--warn) / <alpha-value>)',
          bad: 'rgb(var(--bad) / <alpha-value>)'
        },
        boxShadow: {
          pop: '0 18px 48px -16px rgb(0 0 0 / .6), 0 0 0 1px rgb(var(--line) / .08)'
        }
      }
    }
  }
</script>
<style>
  :root {
    --bg: 13 12 11; --panel: 19 18 16; --elev: 28 26 23; --line: 255 250 240;
    --ink: 236 232 224; --mute: 163 156 145; --dim: 112 106 97;
    --accent: 242 178 51; --on-accent: 23 17 9; --ok: 120 205 140; --warn: 245 128 62; --bad: 240 88 84;
    --side: 236px; --insp: 320px;
    --line-a: .075; --checker-a: #181715; --checker-b: #1e1c19;
  }
  .light {
    --bg: 243 241 236; --panel: 250 248 244; --elev: 255 255 255; --line: 40 30 15;
    --ink: 29 25 20; --mute: 104 97 87; --dim: 154 146 134;
    --accent: 196 134 14; --on-accent: 255 252 245; --ok: 30 135 70; --warn: 206 94 22; --bad: 205 45 50;
    --line-a: .1; --checker-a: #ebe8e2; --checker-b: #f4f2ee;
  }
  html, body { height: 100%; }
  body { background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: 'Instrument Sans', system-ui, sans-serif; font-feature-settings: 'tnum'; -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
  .bd { border-color: rgb(var(--line) / var(--line-a)); }
  .ring-line { box-shadow: inset 0 0 0 1px rgb(var(--line) / var(--line-a)); }
  .hair-t { border-top: 1px solid rgb(var(--line) / var(--line-a)); }
  .hair-b { border-bottom: 1px solid rgb(var(--line) / var(--line-a)); }
  .hair-l { border-left: 1px solid rgb(var(--line) / var(--line-a)); }
  .hair-r { border-right: 1px solid rgb(var(--line) / var(--line-a)); }
  .checker { background-color: var(--checker-a); background-image: linear-gradient(45deg, var(--checker-b) 25%, transparent 25%, transparent 75%, var(--checker-b) 75%), linear-gradient(45deg, var(--checker-b) 25%, transparent 25%, transparent 75%, var(--checker-b) 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px; }
  .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ico-sm { width: 14px; height: 14px; }
  .ico-lg { width: 20px; height: 20px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--line) / .10); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgb(var(--line) / .2); background-clip: content-box; border: 3px solid transparent; }
  ::-webkit-scrollbar-track { background: transparent; }
  .kbd { font: 500 10.5px/1 'IBM Plex Mono', monospace; white-space: nowrap; padding: 3px 5px; border-radius: 5px; background: rgb(var(--line) / .07); color: rgb(var(--mute)); box-shadow: inset 0 -1px 0 rgb(var(--line) / .08); }
  .btn-primary { background: rgb(var(--accent)); color: rgb(var(--on-accent)); box-shadow: inset 0 -2px 0 rgb(0 0 0 / .14); transition: transform .15s, filter .2s; white-space: nowrap; }
  .btn-primary:hover { filter: brightness(1.07); }
  .btn-primary .kbd { background: rgb(var(--on-accent) / .12); color: rgb(var(--on-accent) / .75); box-shadow: none; }
  .btn-primary:active { transform: scale(.985); }
  .seg { background: rgb(var(--line) / .05); border-radius: 9px; padding: 3px; display: flex; gap: 2px; position: relative; min-width: 0; }
  .seg button { flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 550; padding: 6px 10px; border-radius: 6px; color: rgb(var(--mute)); transition: color .15s, background .2s, box-shadow .2s; white-space: nowrap; }
  .seg button:hover { color: rgb(var(--ink)); }
  .seg button[aria-pressed=true] { background: rgb(var(--elev)); color: rgb(var(--ink)); box-shadow: 0 1px 2px rgb(0 0 0 / .35), inset 0 0 0 1px rgb(var(--line) / .09); }
  .light .seg button[aria-pressed=true] { box-shadow: 0 1px 2px rgb(0 0 0 / .12), inset 0 0 0 1px rgb(var(--line) / .06); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, rgb(var(--accent)) var(--p, 50%), rgb(var(--line) / .12) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .2), 0 2px 8px rgb(0 0 0 / .4), 0 0 0 4px rgb(var(--accent) / .0); transition: box-shadow .2s; }
  input[type=range]:hover::-webkit-slider-thumb, input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 1px rgb(0 0 0 / .2), 0 2px 8px rgb(0 0 0 / .4), 0 0 0 5px rgb(var(--accent) / .3); }
  input[type=range]:focus { outline: none; }
  .field { background: rgb(var(--line) / .05); border-radius: 9px; box-shadow: inset 0 0 0 1px rgb(var(--line) / var(--line-a)); transition: box-shadow .15s; outline: none; }
  .field:focus, .field:focus-within { box-shadow: inset 0 0 0 1px rgb(var(--accent) / .8), 0 0 0 3px rgb(var(--accent) / .18); }
  .toggle { width: 34px; height: 20px; border-radius: 20px; background: rgb(var(--line) / .16); position: relative; transition: background .2s; flex: none; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.3,1.4,.5,1); box-shadow: 0 1px 3px rgb(0 0 0 / .4); }
  .toggle[aria-checked=true] { background: rgb(var(--accent)); }
  .toggle[aria-checked=true]::after { transform: translateX(14px); }
  .row { transition: background .15s; }
  .row:hover { background: rgb(var(--line) / .04); }
  .row[data-sel=true] { background: rgb(var(--accent) / .11); box-shadow: inset 2px 0 0 rgb(var(--accent)); }
  .row .act { opacity: 0; transition: opacity .15s; }
  .row:hover .act, .row[data-sel=true] .act { opacity: 1; }
  .card { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .card:hover { transform: translateY(-2px); }
  .card[data-sel=true] { box-shadow: 0 0 0 2px rgb(var(--accent)); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .rise { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fade .2s both; }
  .spin { animation: spin .9s linear infinite; }
  .shimmer { background: linear-gradient(100deg, transparent 20%, rgb(var(--ink) / .14) 50%, transparent 80%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; }
  .pulse-dot { animation: pulseDot 1.2s ease-in-out infinite; }
  .glass { background: rgb(var(--elev) / .78); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); }
  .scrim { background: rgb(0 0 0 / .5); backdrop-filter: blur(6px); }
  .stack { transform: scale(var(--z, 1)); transform-origin: var(--ox, 50%) var(--oy, 50%); transition: transform .28s cubic-bezier(.2,.8,.2,1); will-change: transform; }
  .stack.tracking { transition: transform .05s linear; }
  .divider-handle { box-shadow: 0 0 0 1px rgb(0 0 0 / .25), 0 4px 16px rgb(0 0 0 / .5); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  :focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; border-radius: 6px; }
  button { cursor: default; }
  .font-display { font-family: 'Bricolage Grotesque', 'Instrument Sans', sans-serif; font-optical-sizing: auto; }
  .wc { width: 34px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: rgb(var(--mute)); transition: background .15s, color .15s; }
  .wc:hover { background: rgb(var(--line) / .08); color: rgb(var(--ink)); }
  .wc.close:hover { background: rgb(var(--bad)); color: #fff; }
  /* rótulos que somem quando a coluna central fica estreita */
  main { container-type: inline-size; container-name: main; }
  .lgrid { display: grid; grid-template-columns: minmax(0,1fr) 128px 112px 128px 60px; }
  @container main (max-width: 700px) { .lgrid { grid-template-columns: minmax(0,1fr) 108px 118px 56px; } .lgrid > .c-red { display: none; } }
  @container main (max-width: 660px) { .lbl-c { display: none; } .seg button { padding-inline: 9px; } }
  @container main (max-width: 560px) { .hide-c { display: none !important; } }
  @media (max-width: 1180px) { .hide-w { display: none !important; } :root { --side: 212px; --insp: 288px; } }
</style>
</head>
<body>

<div id="app" class="h-screen flex flex-col">

  <!-- TITLEBAR (janela sem decoração nativa: Tauri decorations:false + data-tauri-drag-region) -->
  <header class="h-11 grid grid-cols-[var(--side)_minmax(0,1fr)_auto] items-center gap-3 pl-3 pr-1.5 hair-b bg-panel relative z-30" data-tauri-drag-region>
    <div class="flex items-center gap-2.5 pl-1 min-w-0">
      <svg class="w-[22px] h-[22px] flex-none" aria-hidden="true"><use href="#logo-mark"/></svg>
      <span class="font-display text-[14px] font-bold tracking-[-.02em] leading-none whitespace-nowrap">guepardo<span class="text-mute font-semibold">sys</span> <span class="text-accent font-semibold">compact</span></span>
    </div>

    <button id="btn-palette" class="justify-self-center flex items-center gap-2.5 h-7 w-full max-w-[380px] min-w-0 px-3 rounded-lg field text-[12px] text-mute hover:text-ink">
      <svg class="ico ico-sm"><use href="#i-search"/></svg>
      <span class="flex-1 text-left truncate">Buscar imagem ou comando…</span>
      <span class="kbd">Ctrl K</span>
    </button>

    <div class="flex items-center gap-1 justify-end">
      <button id="btn-update" class="flex items-center gap-1.5 h-7 px-2.5 rounded-lg text-[11.5px] font-semibold whitespace-nowrap text-accent bg-accent/10 hover:bg-accent/20 transition" title="Nova versão disponível">
        <svg class="ico ico-sm"><use href="#i-arrow-up"/></svg><span id="update-label">Atualizar · v0.1.2</span>
      </button>
      <button id="btn-theme" class="w-7 h-7 grid place-items-center rounded-lg text-mute hover:text-ink hover:bg-ink/5 transition" aria-label="Alternar tema">
        <svg class="ico"><use id="theme-ico" href="#i-sun"/></svg>
      </button>
      <div class="w-px h-4 bg-ink/10 mx-1.5"></div>
      <button class="wc" aria-label="Minimizar"><svg class="ico ico-sm"><use href="#i-min"/></svg></button>
      <button class="wc" aria-label="Maximizar"><svg class="ico ico-sm" style="width:12px;height:12px"><use href="#i-max"/></svg></button>
      <button class="wc close" aria-label="Fechar"><svg class="ico ico-sm"><use href="#i-x"/></svg></button>
    </div>
  </header>

  <div class="flex flex-1 min-h-0">

    <!-- SIDEBAR -->
    <aside class="w-[var(--side)] flex-none bg-panel/60 hair-r flex flex-col min-h-0">
      <div class="p-3 pb-2">
        <div class="grid grid-cols-2 gap-1.5">
          <button id="btn-add-img" class="h-9 rounded-lg flex items-center justify-center gap-1.5 text-[12.5px] font-semibold whitespace-nowrap bg-ink/[.06] hover:bg-ink/[.10] ring-line transition" title="Adicionar imagens (Ctrl O)">
            <svg class="ico ico-sm text-accent"><use href="#i-image-plus"/></svg>Imagens
          </button>
          <button id="btn-add" class="h-9 rounded-lg flex items-center justify-center gap-1.5 text-[12.5px] font-semibold whitespace-nowrap bg-ink/[.06] hover:bg-ink/[.10] ring-line transition" title="Adicionar pasta (Ctrl Shift O)">
            <svg class="ico ico-sm text-accent"><use href="#i-folder"/></svg>Pasta
          </button>
        </div>
        <p class="mt-2 text-[11px] text-dim text-center leading-snug">ou arraste para a janela</p>
      </div>

      <div class="flex-1 overflow-y-auto px-2 pb-3 min-h-0">
        <div class="px-2 pt-1 pb-1.5 flex items-center justify-between">
          <span class="text-[11.5px] font-semibold text-mute">Origem</span>
          <span id="side-count" class="text-[10.5px] text-dim tabular-nums"></span>
        </div>
        <nav id="folders" class="grid gap-0.5"></nav>

        <div class="px-2 pt-5 pb-1.5 flex items-center justify-between">
          <span class="text-[11.5px] font-semibold text-mute">Presets</span>
          <button id="btn-new-preset" class="text-dim hover:text-ink transition" aria-label="Novo preset"><svg class="ico ico-sm"><use href="#i-plus"/></svg></button>
        </div>
        <div id="presets" class="grid gap-1"></div>
      </div>

      <div class="p-3 hair-t">
        <div class="rounded-lg p-3 ring-line">
          <div class="flex items-center justify-between text-[11px] text-mute mb-2">
            <span>Economia acumulada</span><span class="text-ok font-semibold" id="life-pct">68%</span>
          </div>
          <div class="text-[19px] font-semibold tracking-tight tabular-nums leading-none">4,82 <span class="text-[12px] font-medium text-mute">GB</span></div>
          <div class="mt-2.5 h-1.5 rounded-full bg-ink/[.07] overflow-hidden"><div class="h-full rounded-full bg-ok" style="width:68%"></div></div>

    <!-- MAIN -->

          <span id="crumb-title" class="truncate">Todas</span>

        <span id="preset-chip" class="text-[11px] text-mute flex items-center gap-1.5"></span>
      </div>

      <div id="inspector" class="flex-1 overflow-y-auto min-h-0 px-4 py-4 grid gap-5 content-start"></div>

<!-- OVERLAYS -->
<div id="overlay" class="hidden fixed inset-0 z-50"></div>
<div id="dragveil" class="hidden fixed inset-0 z-40 scrim fade grid place-items-center pointer-events-none">
  <div class="rounded-2xl border-2 border-dashed border-accent/70 bg-panel/90 px-16 py-14 text-center shadow-pop rise">
    <div class="mx-auto w-14 h-14 rounded-xl grid place-items-center bg-accent/15 text-accent mb-4"><svg class="ico ico-lg"><use href="#i-image-plus"/></svg></div>
    <div class="font-display text-xl font-bold tracking-tight">Solte imagens ou pastas</div>
    <div class="text-[13px] text-mute mt-1">Pastas são varridas por completo · cada imagem é salva ao lado da original</div>
  </div>
</div>
<div id="toasts" class="fixed bottom-12 left-1/2 -translate-x-1/2 z-[60] grid gap-2 justify-items-center pointer-events-none"></div>

<script>
/* ============================================================
   Protótipo — dados simulados. Nada aqui grava em disco.
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ico = (n, c = '') => `<svg class="ico ${c}"><use href="#i-${n}"/></svg>`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pt = (n, d = 1) => n.toFixed(d).replace('.', ',');
const fmt = kb => kb >= 1024 ? pt(kb / 1024, kb >= 10240 ? 1 : 2) + ' MB' : Math.round(kb) + ' KB';
const pct = n => pt(n, n >= 10 ? 0 : 1) + '%';

/* ---------- geração de imagens de produto (SVG) ---------- */
function art(it, w = 1200, h = 900) {
  const hue = it.hue, h2 = (hue + 38) % 360;
  const shapes = {
    shirt: `<path d="M420 250 L520 215 Q600 270 680 215 L780 250 L900 370 L810 420 L780 385 L780 700 L420 700 L420 385 L390 420 L300 370 Z" fill="hsl(${hue} 62% 46%)"/><path d="M520 215 Q600 270 680 215 Q680 245 600 262 Q520 245 520 215Z" fill="hsl(${hue} 55% 30%)"/><path d="M600 262 V700" stroke="hsl(${hue} 60% 38%)" stroke-width="3" opacity=".5"/>`,
    shoe: `<path d="M250 560 Q260 410 380 395 L520 480 Q650 470 770 520 Q905 545 935 615 L935 665 L250 665 Z" fill="hsl(${hue} 70% 55%)"/><rect x="240" y="640" width="705" height="42" rx="21" fill="#f4f4f6"/><path d="M400 430 L480 480 M440 415 L520 470" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85"/><path d="M700 545 Q820 555 900 610" stroke="hsl(${hue} 60% 38%)" stroke-width="10" fill="none" stroke-linecap="round"/>`,
    bag: `<path d="M470 350 Q470 190 600 190 Q730 190 730 350" fill="none" stroke="hsl(${hue} 48% 28%)" stroke-width="22" stroke-linecap="round"/><rect x="330" y="340" width="540" height="370" rx="56" fill="hsl(${hue} 58% 44%)"/><path d="M330 440 Q600 520 870 440" fill="none" stroke="hsl(${hue} 50% 30%)" stroke-width="5" opacity=".7"/><rect x="570" y="460" width="60" height="44" rx="10" fill="hsl(${hue} 80% 76%)"/>`,
    watch: `<rect x="520" y="90" width="160" height="720" rx="60" fill="hsl(${hue} 30% 22%)"/><circle cx="600" cy="450" r="215" fill="#d9dbe3"/><circle cx="600" cy="450" r="185" fill="hsl(${hue} 45% 14%)"/><path d="M600 450 V330 M600 450 L690 500" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="600" cy="450" r="12" fill="hsl(${hue} 90% 68%)"/>${[...Array(12)].map((_, i) => { const a = i * Math.PI / 6; return `<line x1="${600 + Math.sin(a) * 160}" y1="${450 - Math.cos(a) * 160}" x2="${600 + Math.sin(a) * 175}" y2="${450 - Math.cos(a) * 175}" stroke="#fff" stroke-width="5" opacity=".7"/>`; }).join('')}`,
    logo: `<circle cx="600" cy="450" r="240" fill="hsl(${hue} 70% 55%)"/><text x="600" y="520" text-anchor="middle" font-family="Inter,Arial" font-weight="700" font-size="240" fill="#fff">A</text>`
  };
  const bg = it.shape === 'logo' ? '' : `<rect width="1200" height="900" fill="url(#g)"/><ellipse cx="600" cy="735" rx="330" ry="34" fill="#000" opacity=".22" filter="url(#b)"/>`;
  const grain = it.shape === 'logo' ? '' : `<rect width="1200" height="900" filter="url(#n)" opacity=".16"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue} 30% 88%)"/><stop offset="1" stop-color="hsl(${h2} 35% 74%)"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="16"/></filter><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${it.id}"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0"/></filter></defs>${bg}${shapes[it.shape]}${grain}</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* ---------- estado ---------- */
let uid = 0;
const mk = (folder, name, shape, hue, size, w = 4000, h = 3000, extra = {}) => ({ id: ++uid, folder, name, shape, hue, size, w, h, status: 'pending', out: null, ...extra });
function sample() {
  uid = 0;
  return [
    ...['frente', 'costas', 'detalhe-gola', 'detalhe-manga', 'modelo-1', 'modelo-2'].map((n, i) => mk('Camiseta Polo Azul', `polo-azul-${n}.jpg`, 'shirt', 215, 2600 + i * 310)),
    ...['lateral', 'sola', 'frente', 'topo', 'par', 'cadarco', 'box'].map((n, i) => mk('Tênis Runner X', `runner-x-${n}.jpg`, 'shoe', 12 + i * 4, 3100 + i * 240, 4032, 3024, i === 2 ? { existing: true } : i === 4 ? { existing: true } : {})),
    ...['frente', 'aberta', 'alca', 'zoom-costura', 'lifestyle'].map((n, i) => mk('Bolsa Couro Caramelo', `bolsa-${n}.jpg`, 'bag', 28, 2200 + i * 420, 3600, 2700)),
    ...['frente', 'perfil', 'pulseira'].map((n, i) => mk('Relógio Aurora', `aurora-${n}.png`, 'watch', 262, 5200 + i * 900, 3200, 3200)),
    mk('Relógio Aurora', 'icone-loja.png', 'logo', 262, 225, 512, 512, { bloat: true, alpha: true })
  ];
}

const PRESETS = [
  { id: 'store', name: 'Loja', sub: 'WebP · 2000 px · q80', set: { mode: 'quality', format: 'webp', quality: 80, maxW: 2000, sizes: [], name: '{nome}', sub: 'imagens-compactadas' } },
  { id: 'insta', name: 'Instagram', sub: 'JPG · 1080 px · q85', set: { mode: 'quality', format: 'jpeg', quality: 85, maxW: 1080, sizes: [], name: '{nome}-ig', sub: 'instagram' } },
  { id: 'catalog', name: 'Catálogo até 300 KB', sub: 'WebP · alvo 300 KB', set: { mode: 'target', format: 'webp', target: 300, maxW: 2000, sizes: [], name: '{nome}', sub: 'catalogo' } },
  { id: 'max', name: 'Máxima compressão', sub: 'JPG · mozjpeg', set: { mode: 'quality', format: 'jpeg', quality: 60, maxW: 3840, sizes: [], name: '{nome}-min', sub: 'imagens-compactadas' } }
];

const S = {
  items: sample(), sel: null, view: 'list', folder: null, filter: 'all', theme: 'dark',
  preset: 'store',
  set: { mode: 'quality', format: 'webp', quality: 80, target: 300, maxW: 2000, sizes: [], name: '{nome}', sub: 'imagens-compactadas', useSub: true, conflict: 'ask', bg: '#ffffff', strip: true },
  run: { active: false, cancel: false, t0: 0, done: 0, total: 0 },
  compare: { mode: 'slider', pos: 50, zoom: false }
};
S.sel = S.items[7].id;

/* ---------- estimativa (simulada) ---------- */
function estimate(it) {
  const s = S.set;
  const wmax = s.sizes.length ? Math.max(...s.sizes) : s.maxW;
  const sc = Math.min(1, wmax / it.w);
  const jitter = .86 + ((it.id * 13) % 28) / 100;
  if (it.bloat && s.format !== 'png') return { kb: it.size * 4.4, q: null };
  if (s.mode === 'target') {
    const natural = it.size * sc * sc * .55;
    const kb = Math.min(natural, s.target * (.92 + ((it.id * 7) % 7) / 100));
    return { kb, q: Math.round(62 + ((it.id * 11) % 20)) };
  }
  const base = { webp: .46, avif: .33, jpeg: .62, png: 1.5 }[s.format];
  const q = s.format === 'png' ? 1 : .25 + s.quality / 100 * .9;
  return { kb: it.size * base * q * sc * sc * jitter, q: null };
}
const reduction = it => it.out == null ? null : (1 - it.out / it.size) * 100;
const preview = it => estimate(it).kb;
const visible = () => S.items.filter(i => (!S.folder || i.folder === S.folder) && (S.filter === 'all' || (S.filter === 'warn' && (i.status === 'kept' || (i.existing && i.status === 'pending') || i.alpha)) || (S.filter === 'done' && i.status === 'done')));
const selected = () => S.items.find(i => i.id === S.sel);
const folders = () => [...new Set(S.items.map(i => i.folder))];
const outName = it => {
  const base = it.name.replace(/\.[^.]+$/, '');
  const ext = { webp: 'webp', jpeg: 'jpg', png: 'png', avif: 'avif' }[S.set.format];
  const w = S.set.sizes.length ? S.set.sizes[0] : Math.min(S.set.maxW, it.w);
  return S.set.name.replace('{nome}', base).replace('{largura}', Math.min(w, it.w)).replace('{formato}', ext).replace('{pasta}', it.folder.toLowerCase().replace(/\s+/g, '-')) + '.' + ext;
};

/* ---------- toasts ---------- */
function toast(msg, kind = 'ok', ms = 3200) {
  const el = document.createElement('div');
  const c = { ok: 'text-ok', warn: 'text-warn', bad: 'text-bad', info: 'text-accent' }[kind];
  const i = { ok: 'check', warn: 'alert', bad: 'x', info: 'info' }[kind];
  el.className = 'rise glass rounded-lg px-3.5 py-2.5 text-[12.5px] shadow-pop flex items-center gap-2.5 pointer-events-auto';
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="${c}">${ico(i)}</span><span>${msg}</span>`;
  $('#toasts').append(el);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = 0; el.style.transform = 'translateY(6px)'; setTimeout(() => el.remove(), 300); }, ms);
}

/* ---------- render: sidebar ---------- */
function renderSide() {
  const fs = folders();
  $('#side-count').textContent = fs.length;
  const row = (name, count, done, warn, active, key) => {
    const state = done === count ? 'bg-ok' : done > 0 ? 'bg-accent' : 'bg-ink/20';
    return `<button data-folder="${key}" class="group flex items-center gap-2.5 h-8 px-2 rounded-lg text-[12.5px] text-left transition ${active ? 'bg-ink/[.08] text-ink' : 'text-mute hover:bg-ink/[.04] hover:text-ink'}">
      <span class="${active ? 'text-accent' : 'text-dim group-hover:text-mute'}">${ico('folder', 'ico-sm')}</span>
      <span class="flex-1 truncate">${name}</span>
      ${warn ? `<span class="text-warn" title="Atenção">${ico('alert', 'ico-sm')}</span>` : ''}
      <span class="text-[10.5px] tabular-nums text-dim">${done > 0 && done < count ? done + '/' : ''}${count}</span>
      <span class="w-1.5 h-1.5 rounded-full ${state}"></span></button>`;
  };
  $('#folders').innerHTML =
    row('Todas', S.items.length, S.items.filter(i => i.status === 'done' || i.status === 'kept').length, false, !S.folder, '') +
    fs.map(f => {
      const its = S.items.filter(i => i.folder === f);
      return row(f, its.length, its.filter(i => i.status === 'done' || i.status === 'kept').length, its.some(i => i.status === 'kept'), S.folder === f, f);
    }).join('');
  $$('#folders [data-folder]').forEach(b => b.onclick = () => { S.folder = b.dataset.folder || null; render(); });

  $('#presets').innerHTML = PRESETS.map(p => `
    <button data-preset="${p.id}" class="text-left rounded-[10px] px-2.5 py-2 transition ${S.preset === p.id ? 'bg-accent/12 ring-line' : 'hover:bg-ink/[.04]'}" style="${S.preset === p.id ? 'box-shadow: inset 0 0 0 1px rgb(var(--accent) / .45)' : ''}">
      <div class="flex items-center justify-between"><span class="text-[12.5px] font-550 ${S.preset === p.id ? 'text-ink' : 'text-ink/90'}">${p.name}</span>${S.preset === p.id ? `<span class="text-accent">${ico('check', 'ico-sm')}</span>` : ''}</div>
      <div class="text-[11px] text-mute mt-0.5">${p.sub}</div></button>`).join('');
  $$('#presets [data-preset]').forEach(b => b.onclick = () => applyPreset(b.dataset.preset));
}

function applyPreset(id) {
  const p = PRESETS.find(x => x.id === id);
  S.preset = id; Object.assign(S.set, p.set);
  S.items.forEach(i => { if (i.status !== 'processing') { i.status = 'pending'; i.out = null; } });
  toast(`Preset <b>${p.name}</b> aplicado`, 'info');
  render();
}

/* ---------- render: toolbar / banner ---------- */
function renderToolbar() {
  const list = visible();
  $('#crumb-title').textContent = S.folder || 'Todas';
  $('#crumb-count').textContent = list.length + ' imagens';
  const warnN = S.items.filter(i => i.status === 'kept' || (i.existing && i.status === 'pending') || i.alpha).length;
  const doneN = S.items.filter(i => i.status === 'done').length;
  const chip = (k, label, n) => `<button data-f="${k}" class="h-7 px-2.5 rounded-lg text-[12px] font-550 whitespace-nowrap transition flex items-center gap-1.5 ${S.filter === k ? 'bg-ink/[.09] text-ink' : 'text-mute hover:text-ink hover:bg-ink/[.04]'}">${label}${n != null ? `<span class="text-[10.5px] tabular-nums ${k === 'warn' && n ? 'text-warn' : 'text-dim'}">${n}</span>` : ''}</button>`;
  $('#filters').innerHTML = chip('all', 'Todas') + chip('done', 'Prontas', doneN) + chip('warn', 'Atenção', warnN);
  $$('#filters [data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; render(); });
  $$('#view-seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));
}

function renderBanner() {
  const done = S.items.filter(i => i.status === 'done' || i.status === 'kept');
  const el = $('#banner');
  if (!done.length || S.run.active || done.length < S.items.filter(i => i.status !== 'skipped').length) { el.innerHTML = ''; return; }
  const before = done.reduce((a, i) => a + i.size, 0), after = done.reduce((a, i) => a + i.out, 0);
  const kept = S.items.filter(i => i.status === 'kept').length;
  el.innerHTML = `<div class="rise mx-4 mt-3 rounded-lg px-4 py-3 flex items-center gap-4 ring-line bg-ok/[.06]">
    <div class="w-9 h-9 flex-none rounded-lg grid place-items-center bg-ok/15 text-ok">${ico('check')}</div>
    <div class="min-w-0 flex-1">
      <div class="text-[13.5px] font-semibold tracking-tight truncate">Lote concluído · ${done.length} imagens${kept ? ` <span class="text-warn font-medium text-[12px] whitespace-nowrap">· ${kept} ${kept > 1 ? 'mantidas' : 'mantida'} no original</span>` : ''}</div>
      <div class="text-[12px] text-mute mt-0.5 tabular-nums truncate">${fmt(before)} <span class="text-dim">→</span> <span class="text-ink font-550">${fmt(after)}</span> · economia de <span class="text-ok font-semibold">${fmt(before - after)}</span> (${pct((1 - after / before) * 100)})</div>
    </div>
    <button id="bn-report" title="Relatório" class="flex-none whitespace-nowrap h-8 px-3 rounded-lg text-[12px] font-550 bg-ink/[.07] hover:bg-ink/[.12] transition flex items-center gap-2">${ico('file', 'ico-sm')}<span class="lbl-c">Relatório</span></button>
    <button id="bn-open" title="Abrir pasta" class="flex-none whitespace-nowrap h-8 px-3 rounded-lg text-[12px] font-550 bg-ink/[.07] hover:bg-ink/[.12] transition flex items-center gap-2">${ico('external', 'ico-sm')}<span class="lbl-c">Abrir pasta</span></button>
  </div>`;
  $('#bn-report').onclick = openReport;
  $('#bn-open').onclick = () => toast('Abrindo <b>imagens-compactadas</b> no gerenciador de arquivos…', 'info');
}

/* ---------- render: status chip ---------- */
function statusChip(it) {
  const m = {
    pending: ['Na fila', 'text-dim bg-ink/[.05]', ''],
    processing: ['Compactando', 'text-accent bg-accent/12', '<span class="w-1.5 h-1.5 rounded-full bg-accent pulse-dot"></span>'],
    done: ['Pronta', 'text-ok bg-ok/12', ico('check', 'ico-sm')],
    kept: ['Original mantido', 'text-warn bg-warn/12', ico('alert', 'ico-sm')],
    skipped: ['Ignorada', 'text-mute bg-ink/[.06]', ''],
    error: ['Erro', 'text-bad bg-bad/12', ico('x', 'ico-sm')]
  }[it.status];
  return `<span class="inline-flex items-center gap-1.5 h-[22px] px-2 rounded-full text-[11px] font-550 whitespace-nowrap ${m[1]}">${m[2]}${m[0]}</span>`;
}

/* ---------- render: lista ---------- */
function renderList(list) {
  const groups = {};
  list.forEach(i => (groups[i.folder] ||= []).push(i));
  const maxOut = Math.max(...S.items.map(i => i.size));
  let h = `<div class="h-full overflow-y-auto">
    <div class="sticky top-0 z-10 grid lgrid gap-2.5 px-5 h-8 items-center text-[11px] font-semibold text-dim bg-bg hair-b">
      <span>Arquivo</span><span>Tamanho</span><span class="c-red">Redução</span><span>Status</span><span></span></div>`;
  for (const [f, its] of Object.entries(groups)) {
    const b = its.reduce((a, i) => a + i.size, 0);
    h += `<div class="px-5 pt-4 pb-1.5 flex items-center gap-2 text-[11.5px] text-mute min-w-0"><span class="text-dim flex-none">${ico('folder', 'ico-sm')}</span><span class="font-600 text-ink/90 truncate">${f}</span><span class="text-dim">·</span><span class="tabular-nums whitespace-nowrap">${its.length} fotos · ${fmt(b)}</span><span class="text-dim ml-1 truncate min-w-0 hide-c">→ <span class="font-mono text-[10.5px]">${f}/${S.set.useSub ? S.set.sub + '/' : ''}</span></span></div>`;
    for (const it of its) {
      const r = reduction(it);
      const est = preview(it);
      const showOut = it.out != null;
      h += `<div class="row group grid lgrid gap-2.5 px-5 h-[54px] items-center rise" data-id="${it.id}" data-sel="${S.sel === it.id}" style="animation-delay:${Math.min(list.indexOf(it), 12) * 14}ms">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 rounded-lg overflow-hidden flex-none ring-line ${it.alpha ? 'checker' : ''}"><img src="${art(it, 96, 72)}" class="w-full h-full object-cover" alt=""/></div>
          <div class="min-w-0">
            <div class="text-[12.5px] font-550 flex items-center gap-2 min-w-0"><span class="truncate">${it.name}</span>${it.alpha ? '<span class="text-[10px] px-1.5 py-px rounded bg-ink/[.07] text-mute font-medium">alpha</span>' : ''}${it.existing && it.status === 'pending' ? `<span title="Já existe no destino" class="text-warn">${ico('alert', 'ico-sm')}</span>` : ''}</div>
            <div class="text-[11px] text-dim tabular-nums truncate">${it.w} × ${it.h}${showOut ? ` · <span class="font-mono text-[10.5px]">${it.status === 'kept' ? it.name : outName(it)}</span>` : ''}</div>
          </div>
        </div>
        <div class="text-[12px] tabular-nums whitespace-nowrap truncate">${showOut ? `<span class="text-mute">${fmt(it.size)}</span> <span class="text-dim">→</span> <span class="font-600 ${it.status === 'kept' ? 'text-warn' : ''}">${fmt(it.out)}</span>` : `<span class="text-mute">${fmt(it.size)}</span> <span class="text-dim">→</span> <span class="text-dim">~${fmt(est)}</span>`}</div>
        <div class="c-red flex items-center gap-2.5">
          ${showOut && it.status === 'done' ? `<div class="flex-1 h-1.5 rounded-full bg-ink/[.06] overflow-hidden"><div class="h-full rounded-full" style="width:${Math.max(4, r)}%;background:linear-gradient(90deg,rgb(var(--ok)),rgb(var(--ok)/.6))"></div></div><span class="flex-none text-[12px] font-600 text-ok tabular-nums text-right">−${pct(r)}</span>`
            : it.status === 'kept' ? `<span class="text-[12px] font-600 text-warn tabular-nums" title="A saída ficaria maior que o original">+${pct(-((1 - it.est / it.size) * 100))}</span>`
            : it.status === 'processing' ? `<div class="flex-1 h-1.5 rounded-full overflow-hidden bg-ink/[.06]"><div class="h-full w-full shimmer"></div></div>`
            : `<span class="text-[11.5px] text-dim">—</span>`}
        </div>
        <div class="min-w-0">${statusChip(it)}</div>
        <div class="flex items-center justify-end">
          <span class="act flex">
            ${it.status === 'done' || it.status === 'kept' ? `<button data-dl="${it.id}" class="w-7 h-7 grid place-items-center rounded-md text-mute hover:text-ink hover:bg-ink/[.08]" aria-label="Baixar">${ico('download', 'ico-sm')}</button>` : ''}
            <button data-rm="${it.id}" class="w-7 h-7 grid place-items-center rounded-md text-mute hover:text-bad hover:bg-ink/[.08]" aria-label="Remover">${ico('x', 'ico-sm')}</button>
          </span>
        </div>
      </div>`;
    }
  }
  h += `<div class="h-6"></div></div>`;
  return h;
}

/* ---------- render: comparar ---------- */
function renderCompare(list) {
  const it = selected() || list[0];
  if (!it) return '';
  const done = it.out != null;
  const r = reduction(it);
  const strip = list.map(x => `<button data-id="${x.id}" class="relative flex-none w-[84px] h-[62px] rounded-lg overflow-hidden transition ${x.id === it.id ? 'ring-2 ring-accent scale-100' : 'opacity-60 hover:opacity-100'}"><img src="${art(x, 168, 126)}" class="w-full h-full object-cover" alt="${x.name}"/>${x.status === 'done' ? `<span class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-ok grid place-items-center text-black">${ico('check', 'ico-sm')}</span>` : ''}${x.status === 'kept' ? `<span class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-warn grid place-items-center text-black text-[10px] font-bold leading-none">!</span>` : ''}</button>`).join('');

    <div class="flex-none px-5 py-3 flex items-center gap-3 min-w-0">
      <div class="min-w-0 flex-1">
        <div class="text-[13px] font-600 truncate">${it.name}</div>

      </div>
      <div class="flex-none flex items-center gap-4 text-[12px] tabular-nums whitespace-nowrap">
        <div class="hide-c"><div class="text-[11px] text-dim font-550">Original</div><div class="font-600">${fmt(it.size)}</div></div>
        <div class="text-dim hide-c">${ico('arrow-up', 'ico-sm').replace('<svg', '<svg style="transform:rotate(90deg)"')}</div>
        <div><div class="text-[11px] text-dim font-550">${done ? 'Saída' : 'Estimada'}</div><div class="font-600 ${it.status === 'kept' ? 'text-warn' : ''}">${done ? fmt(it.out) : '~' + fmt(preview(it))}</div></div>
        ${done && it.status === 'done' ? `<div class="px-2 h-7 rounded-md grid place-items-center text-[12.5px] font-700 text-ok bg-ok/12">−${pct(r)}</div>` : ''}
      </div>
      <div class="seg flex-none" id="cmp-mode">
        <button data-m="slider" aria-pressed="${c.mode === 'slider'}" title="Divisor" class="flex items-center justify-center gap-1.5">${ico('compare', 'ico-sm')}<span class="lbl-c">Divisor</span></button>
        <button data-m="side" aria-pressed="${c.mode === 'side'}" title="Lado a lado" class="flex items-center justify-center gap-1.5">${ico('cols', 'ico-sm')}<span class="lbl-c">Lado a lado</span></button>
      </div>
      <button id="cmp-zoom" aria-pressed="${c.zoom}" title="Ver em 100%" class="flex-none h-[36px] px-3 rounded-[9px] text-[12px] font-550 whitespace-nowrap flex items-center gap-1.5 transition ${c.zoom ? 'bg-accent text-onaccent' : 'bg-ink/[.06] text-mute hover:text-ink'}">${ico('zoom', 'ico-sm')}100%</button>
    </div>
    ${it.status === 'kept' ? `<div class="mx-5 mb-2 rounded-lg px-3.5 py-2.5 text-[12px] flex items-center gap-2.5 text-warn bg-warn/10">${ico('alert', 'ico-sm')}O resultado (${fmt(it.est)}) ficou maior que o original. O app manteve o arquivo original para não piorar a loja.</div>` : ''}
    <div class="flex-1 min-h-0 px-5 pb-3">
      <div id="viewer" class="h-full rounded-xl overflow-hidden relative checker ring-line" style="--z:${c.zoom ? 2.6 : 1}">
        ${c.mode === 'slider' ? `
          <div class="absolute inset-0"><div class="stack absolute inset-0"><img src="${art(it)}" class="w-full h-full object-contain" alt="Original"/></div></div>
          <div class="absolute inset-0" id="after-wrap" style="clip-path:inset(0 0 0 ${c.pos}%)"><div class="stack absolute inset-0"><img src="${art(it)}" class="w-full h-full object-contain" style="filter:${done ? 'blur(.7px) saturate(.96) contrast(1.03)' : 'none'}" alt="Saída"/></div></div>
          <div id="divider" class="absolute top-0 bottom-0 w-px bg-white/90 cursor-ew-resize" style="left:${c.pos}%">
            <div class="divider-handle absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-white text-black grid place-items-center"><svg class="ico" style="stroke-width:2.2"><use href="#i-cols"/></svg></div>
          </div>
          <span class="absolute left-3 top-3 glass rounded-md px-2 py-1 text-[11px] font-600 whitespace-nowrap">Original</span>
          <span class="absolute right-3 top-3 glass rounded-md px-2 py-1 text-[11px] font-600 whitespace-nowrap text-accent">Saída · ${outFormatLabel()}</span>` : `
          <div class="absolute inset-0 grid grid-cols-2 gap-px bg-ink/10">
            <div class="relative overflow-hidden bg-black/20"><div class="stack absolute inset-0"><img src="${art(it)}" class="w-full h-full object-contain" alt="Original"/></div><span class="absolute left-3 top-3 glass rounded-md px-2 py-1 text-[11px] font-600 whitespace-nowrap">Original · ${fmt(it.size)}</span></div>
            <div class="relative overflow-hidden bg-black/20"><div class="stack absolute inset-0"><img src="${art(it)}" class="w-full h-full object-contain" style="filter:${done ? 'blur(.7px) saturate(.96) contrast(1.03)' : 'none'}" alt="Saída"/></div><span class="absolute left-3 top-3 glass rounded-md px-2 py-1 text-[11px] font-600 whitespace-nowrap text-accent">Saída · ${done ? fmt(it.out) : '~' + fmt(preview(it))}</span></div>

      </div>

    <div class="flex-none h-[86px] hair-t px-5 flex items-center gap-2 overflow-x-auto bg-panel/50">${strip}</div>
  </div>`;
}
const outFormatLabel = () => ({ webp: 'WebP', jpeg: 'JPG', png: 'PNG', avif: 'AVIF' }[S.set.format]);

function wireCompare() {
  const v = $('#viewer'); if (!v) return;
  $$('#cmp-mode button').forEach(b => b.onclick = () => { S.compare.mode = b.dataset.m; render(); });
  $('#cmp-zoom').onclick = () => { S.compare.zoom = !S.compare.zoom; render(); };
  const div = $('#divider');
  if (div) {
    let drag = false;
    const setPos = e => { const r = v.getBoundingClientRect(); S.compare.pos = Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100)); div.style.left = S.compare.pos + '%'; $('#after-wrap').style.clipPath = `inset(0 0 0 ${S.compare.pos}%)`; };
    v.addEventListener('pointerdown', e => { drag = true; v.setPointerCapture(e.pointerId); setPos(e); });
    v.addEventListener('pointerup', () => drag = false);
    v.addEventListener('pointermove', e => { if (drag) setPos(e); });
  }
  v.addEventListener('pointermove', e => {
    if (!S.compare.zoom) return;
    const r = v.getBoundingClientRect();
    const ox = ((e.clientX - r.left) / r.width * 100) + '%', oy = ((e.clientY - r.top) / r.height * 100) + '%';
    $$('.stack', v).forEach(s => { s.classList.add('tracking'); s.style.setProperty('--ox', ox); s.style.setProperty('--oy', oy); });
  });
}

function custom() { S.preset = null; renderSide(); }

  if (r.active) {

async function start() {
  if (S.run.active) return;
  let pend = S.items.filter(i => !['done', 'kept', 'skipped'].includes(i.status));
  if (!pend.length) { S.items.forEach(i => { i.status = 'pending'; i.out = null; }); pend = [...S.items]; }
  const conflicts = pend.filter(i => i.existing);
  let policy = S.set.conflict;
  if (conflicts.length && policy === 'ask') {
    policy = await conflictDialog(conflicts);
    if (!policy) return;
  }
  S.run = { active: true, cancel: false, t0: performance.now(), done: 0, total: pend.length };
  render();
  for (const it of pend) {
    if (S.run.cancel) break;
    if (it.existing && policy === 'skip') { it.status = 'skipped'; S.run.done++; continue; }
    it.status = 'processing'; renderMain(); renderStatus();
    await sleep(190 + Math.random() * 230);
    const e = estimate(it);
    it.est = e.kb;
    if (e.kb >= it.size) { it.status = 'kept'; it.out = it.size; }
    else { it.status = 'done'; it.out = e.kb; }
    if (it.existing && policy === 'rename') it.renamed = true;
    S.run.done++;
    renderMain(); renderSummary();
  }
  const cancelled = S.run.cancel;
  S.lastSecs = (performance.now() - S.run.t0) / 1000;
  S.run.active = false;
  render();
  const doneN = S.items.filter(i => i.status === 'done' || i.status === 'kept').length;
  if (cancelled) toast(`Cancelado · ${doneN} concluídas foram mantidas. Retome só as pendentes.`, 'warn', 4200);
  else { toast(`${doneN} imagens compactadas em ${pt(S.lastSecs)} s`, 'ok'); if (S.items.some(i => i.status === 'kept')) setTimeout(() => toast('Algumas ficaram maiores — mantivemos o original', 'warn', 4200), 500); }
}

/* ---------- atalhos + drag ---------- */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') { if (!$('#overlay').classList.contains('hidden')) closeModal(); return; }
  if (mod && e.key === 'k') { e.preventDefault(); openPalette(); }
  else if (mod && e.key === 'Enter') { e.preventDefault(); start(); }
  else if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); e.shiftKey ? addFolders() : addImages(); }
  else if (mod && e.key.toLowerCase() === 'v' && document.activeElement.tagName !== 'INPUT') { paste(); }
  else if (!mod && ['INPUT'].indexOf(document.activeElement.tagName) < 0) {
    const l = visible(), i = l.findIndex(x => x.id === S.sel);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { const n = l[Math.min(i + 1, l.length - 1)]; if (n) { S.sel = n.id; renderMain(); renderInspector(); } e.preventDefault(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { const n = l[Math.max(i - 1, 0)]; if (n) { S.sel = n.id; renderMain(); renderInspector(); } e.preventDefault(); }
    else if (e.key === 'Delete' && S.sel) removeItem(S.sel);
    else if (e.key === ' ' && S.sel) { S.view = S.view === 'compare' ? 'list' : 'compare'; render(); e.preventDefault(); }
  }
});
let dragN = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('#dragveil').classList.remove('hidden'); });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#dragveil').classList.add('hidden'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#dragveil').classList.add('hidden'); addFolders(); });

render();
</script>
</body>
</html>
